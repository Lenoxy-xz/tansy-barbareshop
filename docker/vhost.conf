# Render memberi nomor port lewat environment variable PORT.
ServerName localhost
ServerTokens Prod
ServerSignature Off
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
